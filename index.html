<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boss Battle - Step 1</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { background: #000; max-width: 100%; max-height: 100%; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game" width="640" height="480"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
// 전투 상자 (흰 테두리)
const box = { x: 220, y: 200, w: 200, h: 200, border: 5 };

// 하트(플레이어)
const heart = { x: 320, y: 300, size: 16, speed: 180 }; // speed: 초당 픽셀

// 키 입력 상태
const keys = {};
window.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (e.key.startsWith("Arrow")) e.preventDefault(); // 방향키로 페이지 스크롤 방지
});
window.addEventListener("keyup", e => { keys[e.key] = false; });

function update(dt) {
  let dx = 0, dy = 0;
  if (keys["ArrowLeft"])  dx -= 1;
  if (keys["ArrowRight"]) dx += 1;
  if (keys["ArrowUp"])    dy -= 1;
  if (keys["ArrowDown"])  dy += 1;

  // 대각선 이동 시 속도가 빨라지지 않도록 정규화
  if (dx !== 0 && dy !== 0) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; }

  heart.x += dx * heart.speed * dt;
  heart.y += dy * heart.speed * dt;

  // 상자 안쪽에 가두기
  const half = heart.size / 2;
  const left   = box.x + box.border + half;
  const right  = box.x + box.w - box.border - half;
  const top    = box.y + box.border + half;
  const bottom = box.y + box.h - box.border - half;
  heart.x = Math.max(left, Math.min(right, heart.x));
  heart.y = Math.max(top, Math.min(bottom, heart.y));
}

// 하트 모양 그리기 (직접 그린 도형)
function drawHeart(cx, cy, s) {
  const r = s / 4;
  ctx.fillStyle = "#ff0000";
  ctx.beginPath();
  ctx.moveTo(cx, cy + s / 2);
  ctx.lineTo(cx - s / 2, cy - r / 2);
  ctx.arc(cx - r, cy - r, r * 1.2, Math.PI * 0.85, 0, false);
  ctx.arc(cx + r, cy - r, r * 1.2, Math.PI, Math.PI * 0.15, false);
  ctx.lineTo(cx, cy + s / 2);
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 상자
  ctx.fillStyle = "#fff";
  ctx.fillRect(box.x, box.y, box.w, box.h);
  ctx.fillStyle = "#000";
  ctx.fillRect(box.x + box.border, box.y + box.border,
               box.w - box.border * 2, box.h - box.border * 2);

  // 하트
  drawHeart(heart.x, heart.y, heart.size);
}

// 게임 루프
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); // 탭 전환 후 순간이동 방지
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
